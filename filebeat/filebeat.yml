filebeat.inputs:
  - type: filestream
    id: claims-app
    paths:
      - /logs/app.log
    fields:
      service.name: claims-demo
      data_stream.dataset: claims_demo
    fields_under_root: true

output.elasticsearch:
  hosts: ["${ELASTIC_ENDPOINT}:443"]
  api_key: "${ELASTIC_API_KEY}"
  index: "logs-claims_demo-default"

setup.template.enabled: false
setup.ilm.enabled: false
logging.level: info
